<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52">
  <defs>
    <!-- Icon gradient border -->
    <linearGradient id="iconBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="50%" stop-color="#fa3b69"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <!-- Bead gradients for tactile abacus look -->
    <linearGradient id="beadPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="beadBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="beadYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="beadGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Abacus Icon Container -->
  <g transform="translate(2, 2)">
    <!-- Icon Background & Border -->
    <rect x="0" y="0" width="48" height="48" rx="10" ry="10" fill="#0c1222" stroke="url(#iconBorderGrad)" stroke-width="2.6"/>
    
    <!-- 4 Abacus Horizontal Wire Rods -->
    <line x1="7" y1="12" x2="41" y2="12" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="7" y1="20" x2="41" y2="20" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="7" y1="28" x2="41" y2="28" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="7" y1="36" x2="41" y2="36" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Row 1: Pink Beads -->
    <rect x="9"  y="8.5" width="5.5" height="7" rx="2" fill="url(#beadPink)"/>
    <rect x="16" y="8.5" width="5.5" height="7" rx="2" fill="url(#beadPink)"/>
    <rect x="23" y="8.5" width="5.5" height="7" rx="2" fill="url(#beadPink)"/>
    <rect x="30" y="8.5" width="5.5" height="7" rx="2" fill="url(#beadPink)"/>
    <rect x="37" y="8.5" width="4"   height="7" rx="1.5" fill="url(#beadPink)"/>

    <!-- Row 2: Blue Beads -->
    <rect x="9"  y="16.5" width="5.5" height="7" rx="2" fill="url(#beadBlue)"/>
    <rect x="16" y="16.5" width="5.5" height="7" rx="2" fill="url(#beadBlue)"/>
    <rect x="23" y="16.5" width="5.5" height="7" rx="2" fill="url(#beadBlue)"/>
    <rect x="30" y="16.5" width="5.5" height="7" rx="2" fill="url(#beadBlue)"/>
    <rect x="37" y="16.5" width="4"   height="7" rx="1.5" fill="url(#beadBlue)"/>

    <!-- Row 3: Amber/Yellow Beads -->
    <rect x="9"  y="24.5" width="5.5" height="7" rx="2" fill="url(#beadYellow)"/>
    <rect x="16" y="24.5" width="5.5" height="7" rx="2" fill="url(#beadYellow)"/>
    <rect x="23" y="24.5" width="5.5" height="7" rx="2" fill="url(#beadYellow)"/>
    <rect x="30" y="24.5" width="5.5" height="7" rx="2" fill="url(#beadYellow)"/>
    <rect x="37" y="24.5" width="4"   height="7" rx="1.5" fill="url(#beadYellow)"/>

    <!-- Row 4: Green Beads -->
    <rect x="9"  y="32.5" width="5.5" height="7" rx="2" fill="url(#beadGreen)"/>
    <rect x="16" y="32.5" width="5.5" height="7" rx="2" fill="url(#beadGreen)"/>
    <rect x="23" y="32.5" width="5.5" height="7" rx="2" fill="url(#beadGreen)"/>
    <rect x="30" y="32.5" width="5.5" height="7" rx="2" fill="url(#beadGreen)"/>
    <rect x="37" y="32.5" width="4"   height="7" rx="1.5" fill="url(#beadGreen)"/>
  </g>

  <!-- Typography: Abacus in Bold Black, Gen in Vibrant Blue -->
  <text x="60" y="37" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.03em" fill="#000000">Abacus<tspan fill="#2563eb">Gen</tspan></text>
</svg>
